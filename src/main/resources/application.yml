spring:
  application:
    name: inboxai

  datasource:
    url: ${INBOXAI_DB_URL:jdbc:postgresql://localhost:5432/inboxai}
    username: ${INBOXAI_DB_USER:inboxai}
    password: ${INBOXAI_DB_PASSWORD:inboxai}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

inboxai:
  default-user-email: default@inboxai.local
  fetch:
    interval-ms: 600000
    initial-delay-ms: 10000
  classify:
    interval-ms: 60000
    initial-delay-ms: 15000
    batch-size: 20
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    model: claude-haiku-4-5-20251001
    max-tokens: 512
    max-retries: 3
  voyage:
    api-key: ${VOYAGE_API_KEY:}
    base-url: https://api.voyageai.com
    model: voyage-3-lite
    dimension: 512
    max-retries: 3
  embed:
    interval-ms: 60000
    initial-delay-ms: 20000
    batch-size: 20

logging:
  level:
    root: INFO
    com.inboxai: DEBUG
