<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Sign in</title>
</head>
<body>
<main layout:fragment="content">
    <h1>Sign in</h1>

    <p class="form-error" th:if="${param.error}">Invalid email or password.</p>
    <p class="form-error" th:if="${param.ratelimit}">Too many attempts — try again in a minute.</p>
    <p class="empty" th:if="${param.logout}">You've been signed out.</p>
    <p class="empty" th:if="${param.registered}">Account created — sign in below.</p>

    <form method="post" th:action="@{/login}" class="source-form">
        <label>
            Email
            <input type="email" name="username" required autofocus/>
        </label>
        <label>
            Password
            <input type="password" name="password" required/>
        </label>
        <button type="submit">Sign in</button>
    </form>

    <p>New here? <a th:href="@{/register}">Create an account</a>.</p>
</main>
</body>
</html>
