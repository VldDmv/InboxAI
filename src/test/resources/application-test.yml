spring:
  datasource:
    url: jdbc:h2:mem:inboxai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  liquibase:
    enabled: false

inboxai:
  fetch:
    interval-ms: 3600000
    initial-delay-ms: 3600000
  classify:
    interval-ms: 3600000
    initial-delay-ms: 3600000
    batch-size: 5
  anthropic:
    api-key: test-key
    base-url: http://localhost:0
    model: claude-haiku-4-5-20251001
    max-tokens: 256
    max-retries: 1
    retry-initial-backoff: 10ms
  voyage:
    api-key: test-key
    base-url: http://localhost:0
    model: voyage-3-lite
    dimension: 512
    max-retries: 1
    retry-initial-backoff: 10ms
  embed:
    interval-ms: 3600000
    initial-delay-ms: 3600000
    batch-size: 5

logging:
  level:
    com.inboxai: DEBUG
