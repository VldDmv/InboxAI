spring:
  datasource:
    url: jdbc:h2:mem:inboxai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  liquibase:
    enabled: false

inboxai:
  fetch:
    interval-ms: 3600000
    initial-delay-ms: 3600000

logging:
  level:
    com.inboxai: DEBUG
